/* ---------- seeded rng ---------- */
function seededRand(seed) {
  let s = seed;
  return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
}

/* ---------- QR (visual stand-in) ---------- */
function QRCode({ data, size = 160 }) {
  const N = 29, cell = size / N;
  const rand = seededRand(data.split("").reduce((a, c) => a + c.charCodeAt(0), 7));
  const cells = [];
  const inFinder = (r, c) => (r < 7 && c < 7) || (r < 7 && c >= N - 7) || (r >= N - 7 && c < 7);
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    if (inFinder(r, c)) continue;
    if (rand() > 0.52) cells.push([r, c]);
  }
  const finder = (x, y, key) => h("g", { key, transform: `translate(${x},${y})` },
    h("rect", { width: cell * 7, height: cell * 7, fill: "#000" }),
    h("rect", { x: cell, y: cell, width: cell * 5, height: cell * 5, fill: "#fff" }),
    h("rect", { x: cell * 2, y: cell * 2, width: cell * 3, height: cell * 3, fill: "#000" })
  );
  return h("svg", { width: size, height: size, style: { display: "block" } },
    h("rect", { width: size, height: size, fill: "#fff" }),
    cells.map(([r, c], i) => h("rect", { key: i, x: c * cell, y: r * cell, width: cell, height: cell, fill: "#000" })),
    finder(0, 0, "f1"), finder((N - 7) * cell, 0, "f2"), finder(0, (N - 7) * cell, "f3")
  );
}

/* ---------- contactless waves ---------- */
const Waves = () => h("svg", { width: 18, height: 18, viewBox: "0 0 18 18", style: { marginLeft: 6 } },
  [4, 8, 12].map((r, i) => h("path", {
    key: i,

  }))

function VenmoCard() {
  return h("img", { src: VENMO_IMG, style: { position: "absolute", inset: 0, width: "100%", height: "100%", objectFit: "cover" }, draggable: false });
}

function CashAppCard() {
  return h("div", { style: { position: "absolute", inset: 0, background: "#0b0b0b" } },
    h("div", { style: { position: "absolute", top: 18, left: 24, color: "#fff", fontSize: 40, fontWeight: 700 } }, "$"),
    h("div", { style: { position: "absolute", top: 26, right: 24, color: "#fff", fontSize: 22, fontWeight: 700 } }, "Cash App"),
    h("div", { style: { position: "absolute", bottom: 58, right: 24, color: "#fff", fontSize: 16, fontWeight: 500, letterSpacing: 2 } }, "DEBIT"),
    h("div", { style: { position: "absolute", bottom: 12, right: 22, color: "#fff", fontSize: 34, fontWeight: 800, fontStyle: "italic", fontFamily: "'Helvetica Neue', sans-serif", letterSpacing: -1.5, transform: "skewX(-8deg)" } }, "VISA")
  );
}

function AppleCashCard() {
  const dots = [];
  const rand = seededRand(11);
  const cx = 200, cy = 260, rings = 13;
  for (let ring = 0; ring < rings; ring++) {
    const radius = 24 + ring * 17;
    const count = Math.floor(radius / 5.2);
    for (let k = 0; k <= count; k++) {
      const angle = Math.PI + (Math.PI * k) / count;
      const x = cx + radius * Math.cos(angle);
      const y = cy + radius * Math.sin(angle) * 0.88;
      if (y < 40) continue;
      dots.push({ x, y, r: 3 + ring * 0.55, hue: 255 + rand() * 30 });
    }
  }
  return h("div", { style: { position: "absolute", inset: 0, background: "linear-gradient(180deg,#1c1c1e,#0e0e10)" } },

}

/* ---------- wallet ---------- */
const ITEMS = [
  { id: "venmo", kind: "card", Face: VenmoCard },
  { id: "cashapp", kind: "card", Face: CashAppCard },
  { id: "applecash", kind: "card", Face: AppleCashCard },
  { id: "bofa", kind: "card", Face: BofACard },
  { id: "fsu", kind: "ticket" },
];

const CARD_RATIO = 0.628;
const PEEK = 118;
const SPRING = "cubic-bezier(0.32, 0.72, 0, 1)";
const SPRING_BOUNCE = "cubic-bezier(0.34, 1.3, 0.5, 1)";

function AppleWallet() {
  const [selected, setSelected] = useState(null);
  const [phase, setPhase] = useState("stack");
  const [vw, setVw] = useState(390);
  const [standalone, setStandalone] = useState(true);
  const [dragY, setDragY] = useState(0);
  const containerRef = useRef(null);
  const touchStart = useRef(null);
  const dragging = useRef(false);

  useEffect(() => {
    const measure = () => {
      if (containerRef.current) setVw(containerRef.current.offsetWidth);
      const isStandalone = window.navigator.standalone === true ||
        window.matchMedia("(display-mode: standalone)").matches;
      setStandalone(isStandalone);
    };
    measure();
    window.addEventListener("resize", measure);
    return () => window.removeEventListener("resize", measure);
  }, []);

  const cardW = Math.min(vw - 32, 400);
  const cardH = Math.round(cardW * CARD_RATIO);
  const ticketStackH = cardH + 40;

  const open = (id) => {
    if (phase !== "stack") return;
    if (dragY !== 0) return; // ignore click that ends a drag
    setSelected(id);
    setPhase("opening");
    requestAnimationFrame(() => requestAnimationFrame(() => setPhase("open")));
  };
  const close = () => {
    setDragY(0);
    setPhase("closing");
    setTimeout(() => { setSelected(null); setPhase("stack"); }, 480);
  };

  /* swipe-down-to-dismiss on the opened pass */
  const onTouchStart = (e) => {
    if (phase !== "open") return;
    touchStart.current = e.touches ? e.touches[0].clientY : e.clientY;
    dragging.current = true;
  };
  const onTouchMove = (e) => {
    if (!dragging.current || touchStart.current === null) return;
    const y = e.touches ? e.touches[0].clientY : e.clientY;
    const dy = y - touchStart.current;
    if (dy > 0) setDragY(dy); // only drag downward
    else setDragY(dy * 0.15); // slight resistance upward
  };
  const onTouchEnd = () => {
    if (!dragging.current) return;
    dragging.current = false;
    touchStart.current = null;
    if (dragY > 110) {
      close();
    } else {
      setDragY(0); // spring back
    }
  };

  const selIndex = ITEMS.findIndex((it) => it.id === selected);
  const stackY = (i) => i * PEEK;
  const stackHeight = stackY(ITEMS.length - 1) + ticketStackH + 20;
  const isOpenState = phase === "opening" || phase === "open" || phase === "closing";
  const showFull = phase === "open";

  return h("div", {
    style: {
      minHeight: "100vh", background: "#000", display: "flex", justifyContent: "center",
      fontFamily: "-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif",
      overflow: "hidden", touchAction: "manipulation",
    }
  },
    h("div", { ref: containerRef, style: { width: "100%", maxWidth: 430, position: "relative", padding: "0 16px" } },

      /* top safe-area spacer (real Wallet home has no title bar) */
      h("div", { style: { height: "max(54px, env(safe-area-inset-top, 54px))" } }),

      /* "..." button only, like real Wallet's opened pass */
      isOpenState && h("div", {
        style: {
          position: "absolute", top: "max(50px, env(safe-area-inset-top, 50px))",
          right: 20, zIndex: 60,
          opacity: phase === "open" && dragY === 0 ? 1 : 0,
          transition: "opacity 0.2s ease",
        }
      },
        h("button", {
          style: {
            background: "rgba(255,255,255,0.16)", border: "none", color: "#fff",
            width: 30, height: 30, borderRadius: 15, fontSize: 16, cursor: "pointer",
            display: "flex", alignItems: "center", justifyContent: "center",
          }
        }, "\u22EF")
      ),

      /* stack */
      h("div", { style: { position: "relative", height: stackHeight } },
        ITEMS.map((item, i) => {
          const isSel = item.id === selected;
          const isTicket = item.kind === "ticket";
          let y = stackY(i), scale = 1, opacity = 1;
          let ht = isTicket ? ticketStackH : cardH;

          if (isOpenState && phase !== "closing") {
            if (isSel) {
              y = 46 + dragY;
              scale = Math.max(0.9, 1 - dragY / 1400);
              ht = isTicket ? Math.min(640, window.innerHeight - 140) : cardH + 10;
            } else {
              const dir = i < selIndex ? -1 : 1;
              y = stackY(i) + dir * (window.innerHeight * 0.85);
              scale = 0.95; opacity = 0;
            }
          }
          if (phase === "closing") {
            y = stackY(i); scale = 1; opacity = 1;
            ht = isTicket ? ticketStackH : cardH;
          }

          const dist = Math.abs(i - (selIndex === -1 ? 0 : selIndex));
          const delay = (phase === "opening" || phase === "open")
            ? (isSel ? 0 : dist * 0.03)
            : phase === "closing" ? (isSel ? 0 : 0.04 + dist * 0.03) : 0;

          return h("div", {
            key: item.id,
            onClick: () => open(item.id),
            onTouchStart: isSel ? onTouchStart : undefined,
            onTouchMove: isSel ? onTouchMove : undefined,
            onTouchEnd: isSel ? onTouchEnd : undefined,
            onMouseDown: isSel ? onTouchStart : undefined,
            onMouseMove: isSel ? onTouchMove : undefined,
            onMouseUp: isSel ? onTouchEnd : undefined,
            onMouseLeave: isSel ? onTouchEnd : undefined,
            style: {
              position: "absolute", left: 0, right: 0, top: 0, height: ht,
              transform: `translateY(${y}px) scale(${scale})`,
              opacity,
              zIndex: isSel && isOpenState ? 50 : i + 1,
              borderRadius: isTicket ? 12 : 16,
              overflow: "hidden",
              cursor: phase === "stack" ? "pointer" : "grab",
              touchAction: isSel && isOpenState ? "none" : "auto",
              boxShadow: isSel && isOpenState ? "0 18px 60px rgba(0,0,0,0.8)" : "0 -6px 24px rgba(0,0,0,0.55)",
              transition: (isSel && dragging.current) ? "none" : [
                `transform 0.55s ${isSel ? SPRING_BOUNCE : SPRING} ${delay}s`,
                `height 0.55s ${SPRING} ${delay}s`,
                `opacity 0.4s ease ${delay}s`,
                "box-shadow 0.4s ease",
              ].join(", "),
              willChange: "transform, height, opacity",
            }
          },
            isTicket
              ? h(TicketFace, { full: isSel && showFull, notch: isSel && isOpenState })
              : h(item.Face)
          );
        })
      ),

      /* Pass Details */
      phase === "open" && ITEMS[selIndex] && ITEMS[selIndex].kind === "ticket" && h("div", {
        style: {
          position: "absolute", left: 0, right: 0,
          top: 46 + Math.min(640, window.innerHeight - 140) + 14,
          textAlign: "center", color: "#0a84ff", fontSize: 15,
          animation: "navFade 0.3s ease", zIndex: 55, cursor: "pointer",
        }
      }, "Pass Details"),

      /* add-to-homescreen hint */
      !standalone && phase === "stack" && h("div", {
        style: {
          position: "fixed", bottom: 0, left: 0, right: 0,
          background: "rgba(28,28,30,0.92)",
          backdropFilter: "blur(20px)", WebkitBackdropFilter: "blur(20px)",
          padding: "14px 20px calc(14px + env(safe-area-inset-bottom, 8px))",
          color: "#fff", fontSize: 13, lineHeight: 1.45,
          textAlign: "center", zIndex: 100,
        }
      },
        h("b", null, "Go fullscreen: "),
        "tap Share in Safari, then ", h("b", null, "Add to Home Screen"),
        ". Open from that icon and the address bar disappears."
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(AppleWallet));
</script>
